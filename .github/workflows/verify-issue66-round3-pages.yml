name: Verify Issue66 round3 Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue66-round3-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact published provenance
        run: |
          set -euo pipefail
          base='https://fiverocksgames.github.io/text-vs-color/preview/issue-66/'
          matched=0
          for i in $(seq 1 30); do
            if curl -L --fail --silent --show-error "${base}DEPLOYMENT_PROVENANCE.json" -o /tmp/p.json; then
              if python3 - <<'PY'
          import json,sys
          try:
              p=json.load(open('/tmp/p.json'))
          except Exception:
              sys.exit(1)
          ok=(
              p.get('sourceRepository')=='fiverocks-dev/text-vs-color'
              and p.get('sourceCommit')=='a30c22e7f593f1ae1de2d8b682eea9b3bf0d4e1a'
              and p.get('pullRequest')==67
              and p.get('issue')==66
              and p.get('buildRunId')=='36786420932'
              and p.get('previewPath')=='/preview/issue-66/'
          )
          sys.exit(0 if ok else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 3
          done
          test "$matched" = "1"
          curl -L --fail --silent --show-error "$base" -o /tmp/index.html
          grep -q '/text-vs-color/preview/issue-66/assets/' /tmp/index.html

          curl -L --fail --silent --show-error 'https://fiverocksgames.github.io/text-vs-color/preview/DEPLOYMENT_PROVENANCE.json' -o /tmp/main-preview.json
          curl -L --fail --silent --show-error 'https://fiverocksgames.github.io/text-vs-color/preview/issue-51/DEPLOYMENT_PROVENANCE.json' -o /tmp/issue51.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/main-preview.json'))
          b=json.load(open('/tmp/issue51.json'))
          assert a['sourceCommit']=='333f71c94d9c6c12b96b426f64d7f9a743b75ff8'
          assert b['sourceCommit']=='0068e5794a1e37153f88b54230cb87cffecfc854'
          assert b['issue']==51
          PY
      - name: Record marker
        run: |
          mkdir -p ops
          printf '{"sourceCommit":"a30c22e7f593f1ae1de2d8b682eea9b3bf0d4e1a","buildRunId":"36786420932","verificationRunId":"%s"}\n' "$GITHUB_RUN_ID" > ops/issue66-round3-pages-verified.json
          git add ops/issue66-round3-pages-verified.json
          git config user.name "fiverocks-preview-verifier"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "ops: verify Issue 66 round-three preview"
          git push origin HEAD:main
