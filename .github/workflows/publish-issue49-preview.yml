name: Publish Issue49 isolated preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-3eb0-8209-be1e-0de8714d5595/raw?se=2026-09-26T07%3A10%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=b3f8fe75-1339-5e71-ad9a-af1ea47eeb05&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T01%3A50%3A56Z&ske=2026-09-27T01%3A50%3A56Z&sks=b&skv=2026-02-06&sig=sy3KUXBIU0WPbibcnJbd9X1aYHt9NUzw7be5vI8oE2Q%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download verified artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/issue49.zip
          echo "13d77f6e2107a34e2e13abd9f81d0ec239d35f6f3bac411d575c64f3f513c503  /tmp/issue49.zip" | sha256sum -c -
          rm -rf /tmp/issue49
          mkdir -p /tmp/issue49
          unzip -q /tmp/issue49.zip -d /tmp/issue49

      - name: Verify provenance and file hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/issue49'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json',encoding='utf-8'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='c727ed8767fc26569d8e6735456690a24f1f79d2'
          assert p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36225672623'
          expected={x['path']:x['sha256'] for x in p['files']}
          actual={}
          for base,_,names in os.walk(root):
              for name in names:
                  rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
                  if rel=='DEPLOYMENT_PROVENANCE.json': continue
                  with open(os.path.join(base,name),'rb') as f: actual[rel]=hashlib.sha256(f.read()).hexdigest()
          assert actual==expected,(actual,expected)
          print('VERIFIED')
          PY

      - name: Publish only isolated subtree
        run: |
          set -euo pipefail
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/issue49/. preview/issue-49/
          git add preview/issue-49
          git diff --cached --name-only
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 at c727ed8767fc26569d8e6735456690a24f1f79d2"
          git push origin HEAD:main
