name: Verify Issue66 round2 Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue66-round2-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published preview
        run: |
          set -euo pipefail
          base='https://fiverocksgames.github.io/text-vs-color/preview/issue-66/'
          for i in $(seq 1 20); do
            if curl -L --fail --silent --show-error "$base" -o /tmp/index.html; then break; fi
            sleep 3
          done
          curl -L --fail --silent --show-error "${base}DEPLOYMENT_PROVENANCE.json" -o /tmp/p.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='3a80708437510f69a49e167053aaced37504d999'
          assert p['pullRequest']==67 and p['issue']==66
          assert p['buildRunId']=='36676733150'
          assert p['previewPath']=='/preview/issue-66/'
          PY
          grep -q '/text-vs-color/preview/issue-66/assets/' /tmp/index.html

      - name: Record marker
        run: |
          mkdir -p ops
          printf '{"sourceCommit":"3a80708437510f69a49e167053aaced37504d999","buildRunId":"36676733150","verificationRunId":"%s"}\n' "$GITHUB_RUN_ID" > ops/issue66-round2-pages-verified.json
          git add ops/issue66-round2-pages-verified.json
          git config user.name "fiverocks-preview-verifier"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "ops: verify Issue 66 round-two preview"
          git push origin HEAD:main
