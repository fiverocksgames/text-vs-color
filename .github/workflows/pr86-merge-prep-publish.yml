name: Publish PR86 Merge Prep Preview

on:
  push:
    branches:
      - ops/pr86-merge-prep-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-64fc-8206-9e73-de823209f6f6/raw?se=2026-10-05T09%3A48%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=c0bf3f1b-fbcd-50f4-b379-12628fa112c6&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T02%3A10%3A10Z&ske=2026-10-06T02%3A10%3A10Z&sks=b&skv=2026-02-06&sig=9hNaKkMZ1%2BRRXPkos04nAU3RwrCo3V47NpxmzNbjx1E%3D' -o /tmp/pr86.zip
          echo '9ef975294a04d39221f6e6e904df93cb0a7ca4e03fc166d0afd9dd5bfdbb7e85  /tmp/pr86.zip' | sha256sum -c -
          rm -rf /tmp/pr86
          mkdir -p /tmp/pr86
          unzip -q /tmp/pr86.zip -d /tmp/pr86
          test -f /tmp/pr86/index.html
          test -f /tmp/pr86/DEPLOYMENT_PROVENANCE.json
          grep -q 'ad36b276eb66276879ae67e1be102a10a5c87940' /tmp/pr86/DEPLOYMENT_PROVENANCE.json
          grep -q '"/preview/issue-81/"' /tmp/pr86/DEPLOYMENT_PROVENANCE.json
      - name: Replace only Issue 81 preview
        run: |
          set -euo pipefail
          rm -rf preview/issue-81
          mkdir -p preview/issue-81
          cp -R /tmp/pr86/. preview/issue-81/
          git add preview/issue-81
          bad="$(git diff --cached --name-only | grep -v '^preview/issue-81/' || true)"
          test -z "$bad"
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "Five Rocks Games"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "preview: refresh Issue 81 merge-prep candidate"
          git push origin HEAD:main
