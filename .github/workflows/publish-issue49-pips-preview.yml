name: Publish Issue49 pips preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-pips-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ca50-8209-a7be-9887585a42c6/raw?se=2026-09-27T18%3A23%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=411d37cf-1d88-5d7f-ab07-b3886d75cf9c&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T21%3A09%3A46Z&ske=2026-09-27T21%3A09%3A46Z&sks=b&skv=2026-02-06&sig=Gk4tG6Ii/MJF90X9dTxWsgwIevhdsqY/z6Jzz4THIzQ%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "4e277df98060d5f6568d8db3390284dd69814eb4d8763657b273f3d2284a3c42  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'; p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceCommit']=='3118339a827e781e434cbfb8733530019c05f303'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36340143414'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp
          PY
      - name: Replace isolated subtree
        run: |
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 pips at 3118339a827e781e434cbfb8733530019c05f303"
          git push origin HEAD:main
