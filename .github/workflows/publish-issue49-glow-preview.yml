name: Publish Issue49 glow preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-glow-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-b724-8209-ab37-12597da3e10b/raw?se=2026-09-28T14%3A51%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=4ebc3f95-0be9-5229-9bf7-2a2fd8656fda&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T13%3A19%3A34Z&ske=2026-09-29T13%3A19%3A34Z&sks=b&skv=2026-02-06&sig=wqCyPNX7qj%2BUwlqpDf5rR3kEuIa49zebgPEMqiouraI%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "6c9a02224143440a571773a0c774bac6b1567197680403c4b078162f7a753770  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'; p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceCommit']=='90aee65856cc652e163e5a09bd0a84691cc01194'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36438420656'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          PY
      - name: Replace isolated subtree only
        run: |
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 glow at 90aee65856cc652e163e5a09bd0a84691cc01194"
          git push origin HEAD:main
