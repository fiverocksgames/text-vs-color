name: Publish Issue66 playtest follow-up preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue66-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-dd64-8209-8739-ce60f36f80e4/raw?se=2026-09-30T02%3A56%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=2bc59a1a-d423-5f24-ba51-55c15d75a2a8&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T02%3A44%3A23Z&ske=2026-10-01T02%3A44%3A23Z&sks=b&skv=2026-02-06&sig=EwWa6I0wdRN9g3FH8mGxcg9RN9EcuHqihsHI2WgviDs%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "bfbd2466c0994597463e30ad279a0c7b95dc7d3f83808e3500ac4133ff277f23  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='a59dc204cf04ef7572bedc374429effc53a75386'
          assert p['pullRequest']==67 and p['issue']==66
          assert p['channel']=='human-pl-playtest-follow-up'
          assert p['previewPath']=='/preview/issue-66/'
          assert p['buildRunId']=='36661733664'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json':
                continue
              with open(os.path.join(base,name),'rb') as f:
                act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          forbidden=[]
          for base,_,names in os.walk(root):
            for name in names:
              if name.endswith(('.map','.ts','.tsx')):
                forbidden.append(os.path.relpath(os.path.join(base,name),root))
          assert not forbidden,forbidden
          PY

      - name: Replace isolated Issue66 subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-66
          mkdir -p preview/issue-66
          cp -R /tmp/p/. preview/issue-66/
          git add preview/issue-66
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-66/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #66 at a59dc204cf04ef7572bedc374429effc53a75386"
          git push origin HEAD:main
