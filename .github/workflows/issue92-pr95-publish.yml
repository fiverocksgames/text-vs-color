name: Publish Issue92 PR95 Preview

on:
  push:
    branches:
      - ops/issue92-pr95-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-c474-8209-9738-faf741fb90d3/raw?se=2026-10-05T13%3A35%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=9b112398-ecdc-552d-8430-d4352a6e0e62&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T00%3A15%3A02Z&ske=2026-10-06T00%3A15%3A02Z&sks=b&skv=2026-02-06&sig=tr8k%2BzKLDtmCZW6uoeq1gAa1a8/GL3uWxex284FxetI%3D' -o /tmp/issue92.zip
          echo '9095a9119435bbe45aba3bf7519379176f3d4e64918c92064e5cb14099c15a38  /tmp/issue92.zip' | sha256sum -c -
          rm -rf /tmp/issue92
          mkdir -p /tmp/issue92
          unzip -q /tmp/issue92.zip -d /tmp/issue92
          test -f /tmp/issue92/index.html
          test -f /tmp/issue92/DEPLOYMENT_PROVENANCE.json
          grep -q '85c6ddd2d56d49ff73a6791af09a20017eb91ca8' /tmp/issue92/DEPLOYMENT_PROVENANCE.json
          grep -q '"/preview/issue-92/"' /tmp/issue92/DEPLOYMENT_PROVENANCE.json
      - name: Replace only Issue 92 preview
        run: |
          set -euo pipefail
          rm -rf preview/issue-92
          mkdir -p preview/issue-92
          cp -R /tmp/issue92/. preview/issue-92/
          git add preview/issue-92
          bad="$(git diff --cached --name-only | grep -v '^preview/issue-92/' || true)"
          test -z "$bad"
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "Five Rocks Games"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "preview: publish Issue 92 PR95 candidate"
          git push origin HEAD:main
