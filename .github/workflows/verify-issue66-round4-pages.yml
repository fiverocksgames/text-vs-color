name: Verify Issue66 round4 Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue66-round4-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact published provenance
        run: |
          set -euo pipefail
          base='https://fiverocksgames.github.io/text-vs-color/preview/issue-66/'
          matched=0
          for i in $(seq 1 30); do
            if curl -L --fail --silent --show-error "${base}DEPLOYMENT_PROVENANCE.json" -o /tmp/p.json; then
              if python3 - <<'PY'
          import json,sys
          try:
              p=json.load(open('/tmp/p.json'))
          except Exception:
              sys.exit(1)
          ok=(
              p.get('sourceRepository')=='fiverocks-dev/text-vs-color'
              and p.get('sourceCommit')=='6936f685697d691390011b41dd4295a03325b38a'
              and p.get('pullRequest')==67
              and p.get('issue')==66
              and p.get('buildRunId')=='36789152279'
              and p.get('previewPath')=='/preview/issue-66/'
          )
          sys.exit(0 if ok else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 3
          done
          test "$matched" = "1"
          curl -L --fail --silent --show-error "$base" -o /tmp/index.html
          grep -q '/text-vs-color/preview/issue-66/assets/' /tmp/index.html
      - name: Record marker
        run: |
          mkdir -p ops
          printf '{"sourceCommit":"6936f685697d691390011b41dd4295a03325b38a","buildRunId":"36789152279","verificationRunId":"%s"}\n' "$GITHUB_RUN_ID" > ops/issue66-round4-pages-verified.json
          git add ops/issue66-round4-pages-verified.json
          git config user.name "fiverocks-preview-verifier"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "ops: verify Issue 66 round-four preview"
          git push origin HEAD:main
