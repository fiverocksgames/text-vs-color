name: Publish Issue49 trophy letterbox preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-letterbox-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-fa30-8209-905c-02a0ad451986/raw?se=2026-09-28T21%3A22%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=40ae0969-50d2-51e2-b432-2ff14e845c6a&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A41%3A14Z&ske=2026-09-29T20%3A41%3A14Z&sks=b&skv=2026-02-06&sig=ymTEQYYlSZ%2B7znTPbdQtRLJ86P3yxHq640GOJ8q2aFw%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "0b9b5397460bb4189bfddaa61408b6800c7b433c69e55caa72eafc96b65cf26f  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='e94d2468da2d8d4fbbd60ee6aa3a4cdc7d7a6720'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36484973332'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json':
                continue
              with open(os.path.join(base,name),'rb') as f:
                act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          forbidden=[]
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root)
              if name.endswith('.map') or name.endswith('.ts') or name.endswith('.tsx'):
                forbidden.append(rel)
          assert not forbidden,forbidden
          PY
      - name: Replace isolated preview subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 trophy letterbox at e94d2468da2d8d4fbbd60ee6aa3a4cdc7d7a6720"
          git push origin HEAD:main
