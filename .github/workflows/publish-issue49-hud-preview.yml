name: Publish Issue49 separated HUD preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-hud-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-62b4-8209-8972-c8c79e8dcd9c/raw?se=2026-09-27T15%3A34%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=e0b48bd6-3106-5d2f-9c53-a335d6611430&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T23%3A44%3A47Z&ske=2026-09-27T23%3A44%3A47Z&sks=b&skv=2026-02-06&sig=C/e0ef0QURUeX//8IpJioui7KhXZFwrziBvpTMZObsM%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "4200d6a40e95df4a763588bbbcbacb7dd047007c49340e6a9be0ba9b85be2f07  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'; p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceCommit']=='4a884c90bc0cf60101ff7dad59aac6420b6fa66a'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36329701159'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp
          PY
      - name: Replace isolated subtree
        run: |
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 HUD at 4a884c90bc0cf60101ff7dad59aac6420b6fa66a"
          git push origin HEAD:main
