name: Verify Issue49 trophy letterbox Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue49-letterbox-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published Pages
        run: |
          set -euo pipefail
          base='https://fiverocksgames.github.io/text-vs-color/preview/issue-49/'
          for i in $(seq 1 20); do
            if curl -L --fail --silent --show-error "$base" -o /tmp/index.html; then break; fi
            sleep 3
          done
          curl -L --fail --silent --show-error "${base}DEPLOYMENT_PROVENANCE.json" -o /tmp/p.json
          grep -q '/text-vs-color/preview/issue-49/assets/index-BW158A-n.js' /tmp/index.html
          grep -q '/text-vs-color/preview/issue-49/assets/index-CCJhJ8CS.css' /tmp/index.html
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='e94d2468da2d8d4fbbd60ee6aa3a4cdc7d7a6720'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['buildRunId']=='36484973332'
          assert p['previewPath']=='/preview/issue-49/'
          PY
      - name: Record marker
        run: |
          mkdir -p ops
          printf '{"url":"https://fiverocksgames.github.io/text-vs-color/preview/issue-49/","sourceCommit":"e94d2468da2d8d4fbbd60ee6aa3a4cdc7d7a6720","buildRunId":"36484973332","verificationRunId":"%s"}\n' "$GITHUB_RUN_ID" > ops/issue49-letterbox-pages-verified.json
          git add ops/issue49-letterbox-pages-verified.json
          git config user.name "fiverocks-preview-verifier"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "ops: verify Issue 49 trophy letterbox preview"
          git push origin HEAD:main
