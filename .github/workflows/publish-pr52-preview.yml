name: Publish PR52 Preview
# one-shot authorized preview publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr52-preview.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified PR52 static artifact
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-aa38-8206-a721-471d9093dabc/raw?se=2026-09-25T13%3A12%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=1d098c37-eaee-5fd5-9e5c-e4cc5865b4e7&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T10%3A47%3A16Z&ske=2026-09-26T10%3A47%3A16Z&sks=b&skv=2026-02-06&sig=qPzTPo8SKU5Ucp/uuvJzbWGNK658PvDp%2BiO0Th9CNsQ%3D"
      ARTIFACT_SHA256: "e62e8aa1dcae126589a669ef65ba143925b48549898615ac839805b8452f4d2f"
      SOURCE_SHA: "06c033e69f0c8bab19f78264f45d46f6a307adac"
      PREVIEW_DIR: "preview/pr-52"
    steps:
      - name: Check out public deployment repository
        uses: actions/checkout@v4

      - name: Download verified source artifact
        run: |
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/pr52.zip
          echo "$ARTIFACT_SHA256  /tmp/pr52.zip" | sha256sum -c -

      - name: Validate provenance and file hashes
        run: |
          rm -rf /tmp/pr52
          mkdir -p /tmp/pr52
          unzip -q /tmp/pr52.zip -d /tmp/pr52
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("/tmp/pr52")
          provenance_path = root / "DEPLOYMENT_PROVENANCE.json"
          if not provenance_path.is_file():
              raise SystemExit("missing DEPLOYMENT_PROVENANCE.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8-sig"))
          expected = {
              "sourceRepository": "fiverocks-dev/text-vs-color",
              "sourceCommit": "06c033e69f0c8bab19f78264f45d46f6a307adac",
              "pullRequest": 52,
              "previewPath": "/preview/pr-52/",
              "buildRunId": "36138838095",
          }
          for key, value in expected.items():
              if str(provenance.get(key)) != str(value):
                  raise SystemExit(f"provenance mismatch for {key}: {provenance.get(key)!r}")
          declared = {}
          for entry in provenance.get("files", []):
              rel = entry["path"]
              if rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts or "\\" in rel:
                  raise SystemExit(f"unsafe/noncanonical path: {rel}")
              declared[rel] = entry["sha256"]
          actual = {}
          for path in root.rglob("*"):
              if path.is_file() and path.name != "DEPLOYMENT_PROVENANCE.json":
                  rel = path.relative_to(root).as_posix()
                  if rel.endswith(".map"):
                      raise SystemExit(f"source map prohibited: {rel}")
                  actual[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != declared:
              raise SystemExit(f"artifact file/hash mismatch: declared={declared} actual={actual}")
          required = {"index.html", "assets/index-BxilAdR_.css", "assets/index-ClIpZGu8.js"}
          if set(actual) != required:
              raise SystemExit(f"unexpected deployable tree: {sorted(actual)}")
          print("Verified exact-SHA artifact and provenance")
          PY

      - name: Stage isolated preview subtree
        run: |
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -a /tmp/pr52/. "$PREVIEW_DIR/"
          git add "$PREVIEW_DIR"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          if not changed:
              raise SystemExit("no preview changes staged")
          bad = [p for p in changed if not p.startswith("preview/pr-52/")]
          if bad:
              raise SystemExit(f"staged diff escaped preview subtree: {bad}")
          print("\n".join(changed))
          PY

      - name: Publish preview
        run: |
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: fiverocks-dev/text-vs-color#52@$SOURCE_SHA"
          git push origin HEAD:main
