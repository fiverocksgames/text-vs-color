name: Publish Issue49 inset-button preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-inset-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-d72c-8209-b58e-f8dcab9b7848/raw?se=2026-09-28T21%3A43%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=b4e594f8-b602-513c-a21c-f6d1aefb2740&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A43%3A41Z&ske=2026-09-29T20%3A43%3A41Z&sks=b&skv=2026-02-06&sig=DA64/gHcgb26l%2B8irm8R7qXQBUXdZj99krR%2BjHlW8Hk%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "92d3cef4c3ddff22f751619576011e4349f0c9b31fbe23f1473cd0bcce12e30f  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='91264b8ff8a36d1e0fa7ad04db7d18697f194ab2'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36487438126'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          PY
      - name: Replace isolated subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 inset buttons at 91264b8ff8a36d1e0fa7ad04db7d18697f194ab2"
          git push origin HEAD:main
