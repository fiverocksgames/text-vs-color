name: Publish Issue81 PR86 Preview

on:
  push:
    branches:
      - ops/issue81-pr86-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-215c-8206-91cb-4209c5e48227/raw?se=2026-10-05T08%3A15%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=67f0bdad-b71a-5db3-a66d-9446fb611948&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T21%3A56%3A57Z&ske=2026-10-05T21%3A56%3A57Z&sks=b&skv=2026-02-06&sig=CGk6A3k6yn7XK2GsC2g4JvpvFF6r5zB4vojyBcUJXIk%3D' -o /tmp/issue81.zip
          echo 'a3c652205f4920f46bccdb72661985a68b0768c3575df8dd91a8dd95916b1bac  /tmp/issue81.zip' | sha256sum -c -
          rm -rf /tmp/issue81
          mkdir -p /tmp/issue81
          unzip -q /tmp/issue81.zip -d /tmp/issue81
          test -f /tmp/issue81/index.html
          test -f /tmp/issue81/DEPLOYMENT_PROVENANCE.json
          grep -q '3d102f9db0c4d248b009db23db98eaa5fb46c6ee' /tmp/issue81/DEPLOYMENT_PROVENANCE.json
          grep -q '"/preview/issue-81/"' /tmp/issue81/DEPLOYMENT_PROVENANCE.json
      - name: Replace only Issue 81 preview channel
        run: |
          set -euo pipefail
          rm -rf preview/issue-81
          mkdir -p preview/issue-81
          cp -R /tmp/issue81/. preview/issue-81/
          git add preview/issue-81
          bad="$(git diff --cached --name-only | grep -v '^preview/issue-81/' || true)"
          test -z "$bad"
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "Five Rocks Games"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "preview: publish Issue 81 PR86 time-neutral scoring"
          git push origin HEAD:main
