name: Publish PR28 Preview
# one-shot authorized preview publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr28-preview.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified PR28 static artifact
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-f4c4-81fa-b08d-fed280446668/raw?se=2026-09-18T03%3A24%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=91b5f39f-315a-5ea6-b6f5-a818f3ec4751&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T23%3A39%3A40Z&ske=2026-09-18T23%3A39%3A40Z&sks=b&skv=2026-02-06&sig=kT3afitMX2pBQ04DBM4NdZ3wxMLVEFBKqmI0oRcc81Y%3D"
      ARTIFACT_SHA256: "4f35336dc1b1c532447786aba581e11284a330c996be7f9ad093a4c7ae861962"
      SOURCE_SHA: "d18f8d16603b4c5339959f4b40ef4ae39e75a7be"
      PREVIEW_DIR: "preview/pr-28"
    steps:
      - name: Check out public deployment repository
        uses: actions/checkout@v4

      - name: Download verified source artifact
        run: |
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/pr28.zip
          echo "$ARTIFACT_SHA256  /tmp/pr28.zip" | sha256sum -c -

      - name: Validate provenance and file hashes
        run: |
          rm -rf /tmp/pr28
          mkdir -p /tmp/pr28
          unzip -q /tmp/pr28.zip -d /tmp/pr28
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("/tmp/pr28")
          provenance_path = root / "DEPLOYMENT_PROVENANCE.json"
          if not provenance_path.is_file():
              raise SystemExit("missing DEPLOYMENT_PROVENANCE.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8-sig"))
          expected = {
              "sourceRepository": "fiverocks-dev/text-vs-color",
              "sourceCommit": "d18f8d16603b4c5339959f4b40ef4ae39e75a7be",
              "pullRequest": 28,
              "previewPath": "/preview/pr-28/",
          }
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"provenance mismatch for {key}: {provenance.get(key)!r}")
          declared = {}
          for entry in provenance.get("files", []):
              rel = entry["path"]
              if rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts:
                  raise SystemExit(f"unsafe path: {rel}")
              declared[rel] = entry["sha256"]
          actual = {}
          for path in root.rglob("*"):
              if path.is_file() and path.name != "DEPLOYMENT_PROVENANCE.json":
                  rel = path.relative_to(root).as_posix()
                  if rel.endswith(".map"):
                      raise SystemExit(f"source map prohibited: {rel}")
                  actual[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != declared:
              raise SystemExit(f"artifact file/hash mismatch: declared={declared} actual={actual}")
          required = {"index.html", "assets/index-B6hmJRLE.css", "assets/index-CI9MhYnW.js"}
          if set(actual) != required:
              raise SystemExit(f"unexpected deployable tree: {sorted(actual)}")
          print("Verified exact-SHA artifact and provenance")
          PY

      - name: Stage isolated preview subtree
        run: |
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -a /tmp/pr28/. "$PREVIEW_DIR/"
          git add "$PREVIEW_DIR"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          if not changed:
              raise SystemExit("no preview changes staged")
          bad = [p for p in changed if not p.startswith("preview/pr-28/")]
          if bad:
              raise SystemExit(f"staged diff escaped preview subtree: {bad}")
          print("\n".join(changed))
          PY

      - name: Publish preview
        run: |
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: fiverocks-dev/text-vs-color#28@$SOURCE_SHA"
          git push origin HEAD:main
