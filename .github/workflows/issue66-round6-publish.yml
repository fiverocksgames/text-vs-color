name: Publish Issue66 Round6 Preview

on:
  push:
    branches:
      - ops/issue66-round6-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0bc0-8209-82f3-1267d320d834/raw?se=2026-10-04T02%3A06%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=b4728072-b11b-5b31-bf3b-7f2eee145b3e&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T01%3A26%3A08Z&ske=2026-10-05T01%3A26%3A08Z&sks=b&skv=2026-02-06&sig=gzRKayxfn%2Br02wikgzQ6xsptY2SehXFRomjYaSZAvAY%3D' -o /tmp/issue66-round6.zip
          rm -rf /tmp/issue66-round6
          mkdir -p /tmp/issue66-round6
          unzip -q /tmp/issue66-round6.zip -d /tmp/issue66-round6
          test -f /tmp/issue66-round6/index.html
          test -f /tmp/issue66-round6/DEPLOYMENT_PROVENANCE.json
          grep -q 'f2a83240fa5bdbbc90884c07d75750dde0298b55' /tmp/issue66-round6/DEPLOYMENT_PROVENANCE.json
      - name: Replace only Issue 66 preview channel
        run: |
          set -euo pipefail
          rm -rf preview/issue-66
          mkdir -p preview/issue-66
          cp -R /tmp/issue66-round6/. preview/issue-66/
          git status --short
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "Five Rocks Games"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git add preview/issue-66
          git diff --cached --quiet && exit 0
          git commit -m "preview: update Issue 66 round-six stimulus placement"
          git push origin HEAD:main
