name: Publish Issue49 aligned HUD preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-alignment-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1ef4-8209-a26a-7a25ab7f9458/raw?se=2026-09-28T07%3A16%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=d0c5e88a-7577-5a74-9d58-314a8f701d89&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A41%3A53Z&ske=2026-09-29T00%3A41%3A53Z&sks=b&skv=2026-02-06&sig=DLGI1vCwb0NCzE1Vhepl16saqb28FLxfrQt6Ums2P5Q%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "89e5ea16be1fd2725d8a6058884748b9e1396b22a8f9169cbd0d666905e4e9ca  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'; p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceCommit']=='4abfd96421b42957ab6d1b2023c37fd7ba88e013'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36390197501'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp
          PY
      - name: Replace isolated subtree
        run: |
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 aligned HUD at 4abfd96421b42957ab6d1b2023c37fd7ba88e013"
          git push origin HEAD:main
