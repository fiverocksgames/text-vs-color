name: Publish updated Issue49 PR54 preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-pr54-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0078-8209-8a42-fddb60f3b9f2/raw?se=2026-09-27T10%3A39%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=f374b311-71b6-5616-831d-ad8b361fa68f&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T01%3A39%3A53Z&ske=2026-09-28T01%3A39%3A53Z&sks=b&skv=2026-02-06&sig=zpddvTbWL8ApuegPyddAQn%2BAoR4jc7mE/taod8kpK%2Bk%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "af67e1ea4b529d048df48c969bda7100d509f22eab4c7152bdab3c9e7d8c1ea6  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceCommit']=='6d47f994fbdc52eac597405bc687de1e897ce52a'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36312956347'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          print('VERIFIED')
          PY
      - name: Replace isolated subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 PR54 at 6d47f994fbdc52eac597405bc687de1e897ce52a"
          git push origin HEAD:main
