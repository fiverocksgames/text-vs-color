name: Publish PR43 Preview
# one-shot authorized preview publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr43-preview.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified PR43 static artifact
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-df18-81f5-addd-b5acb7db05ef/raw?se=2026-09-22T05%3A56%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=eea59478-3ce1-5f8d-8f0b-71962411f696&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T01%3A20%3A04Z&ske=2026-09-23T01%3A20%3A04Z&sks=b&skv=2026-02-06&sig=ORIUWik2zOayJrB62FAxUrYaWDgd28njENe5MlBQmbA%3D"
      ARTIFACT_SHA256: "ff8379e3fbe3a96b44060675198ca9016b941b2a146fa8b664786502c238a67e"
      SOURCE_SHA: "487e16ba5636c43b16524b38512c1f6a8d7f1082"
      PREVIEW_DIR: "preview/pr-43"
    steps:
      - name: Check out public deployment repository
        uses: actions/checkout@v4

      - name: Download verified source artifact
        run: |
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/pr43.zip
          echo "$ARTIFACT_SHA256  /tmp/pr43.zip" | sha256sum -c -

      - name: Validate provenance and file hashes
        run: |
          rm -rf /tmp/pr43
          mkdir -p /tmp/pr43
          unzip -q /tmp/pr43.zip -d /tmp/pr43
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("/tmp/pr43")
          provenance_path = root / "DEPLOYMENT_PROVENANCE.json"
          if not provenance_path.is_file():
              raise SystemExit("missing DEPLOYMENT_PROVENANCE.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8-sig"))
          expected = {
              "sourceRepository": "fiverocks-dev/text-vs-color",
              "sourceCommit": "487e16ba5636c43b16524b38512c1f6a8d7f1082",
              "pullRequest": 43,
              "previewPath": "/preview/pr-43/",
          }
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"provenance mismatch for {key}: {provenance.get(key)!r}")
          declared = {}
          for entry in provenance.get("files", []):
              rel = entry["path"]
              if rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts:
                  raise SystemExit(f"unsafe path: {rel}")
              declared[rel] = entry["sha256"]
          actual = {}
          for path in root.rglob("*"):
              if path.is_file() and path.name != "DEPLOYMENT_PROVENANCE.json":
                  rel = path.relative_to(root).as_posix()
                  if rel.endswith(".map"):
                      raise SystemExit(f"source map prohibited: {rel}")
                  actual[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != declared:
              raise SystemExit(f"artifact file/hash mismatch: declared={declared} actual={actual}")
          required = {"index.html", "assets/index-uuF3ruqW.css", "assets/index-COK_Ymg2.js"}
          if set(actual) != required:
              raise SystemExit(f"unexpected deployable tree: {sorted(actual)}")
          print("Verified exact-SHA artifact and provenance")
          PY

      - name: Stage isolated preview subtree
        run: |
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -a /tmp/pr43/. "$PREVIEW_DIR/"
          git add "$PREVIEW_DIR"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          if not changed:
              raise SystemExit("no preview changes staged")
          bad = [p for p in changed if not p.startswith("preview/pr-43/")]
          if bad:
              raise SystemExit(f"staged diff escaped preview subtree: {bad}")
          print("\n".join(changed))
          PY

      - name: Publish preview
        run: |
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: fiverocks-dev/text-vs-color#43@$SOURCE_SHA"
          git push origin HEAD:main
