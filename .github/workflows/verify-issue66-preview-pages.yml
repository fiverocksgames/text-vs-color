name: Verify Issue66 preview Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue66-preview-pages.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify published Issue66 preview
        run: |
          set -euo pipefail
          base='https://fiverocksgames.github.io/text-vs-color/preview/issue-66/'
          for i in $(seq 1 20); do
            if curl -L --fail --silent --show-error "$base" -o /tmp/index.html; then
              break
            fi
            sleep 3
          done
          curl -L --fail --silent --show-error "${base}DEPLOYMENT_PROVENANCE.json" -o /tmp/p.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='a59dc204cf04ef7572bedc374429effc53a75386'
          assert p['pullRequest']==67 and p['issue']==66
          assert p['buildRunId']=='36661733664'
          assert p['previewPath']=='/preview/issue-66/'
          PY
          grep -q '/text-vs-color/preview/issue-66/assets/' /tmp/index.html

          # Existing preview channels must remain untouched.
          curl -L --fail --silent --show-error 'https://fiverocksgames.github.io/text-vs-color/preview/DEPLOYMENT_PROVENANCE.json' -o /tmp/main-preview.json
          curl -L --fail --silent --show-error 'https://fiverocksgames.github.io/text-vs-color/preview/issue-51/DEPLOYMENT_PROVENANCE.json' -o /tmp/issue51.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/main-preview.json'))
          b=json.load(open('/tmp/issue51.json'))
          assert a['sourceCommit']=='333f71c94d9c6c12b96b426f64d7f9a743b75ff8'
          assert b['sourceCommit']=='0068e5794a1e37153f88b54230cb87cffecfc854'
          assert b['issue']==51
          PY

      - name: Record temporary marker
        run: |
          mkdir -p ops
          printf '{"url":"https://fiverocksgames.github.io/text-vs-color/preview/issue-66/","sourceCommit":"a59dc204cf04ef7572bedc374429effc53a75386","buildRunId":"36661733664","verificationRunId":"%s"}\n' "$GITHUB_RUN_ID" > ops/issue66-preview-verified.json
          git add ops/issue66-preview-verified.json
          git config user.name "fiverocks-preview-verifier"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "ops: verify Issue 66 preview"
          git push origin HEAD:main
