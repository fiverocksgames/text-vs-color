name: Publish Issue66 round5 preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue66-round5-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-5a34-8207-b9b6-ce07247b89f5/raw?se=2026-10-01T10%3A08%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=012f9bbf-da37-52aa-bcdf-26cadf782485&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A21%3A39Z&ske=2026-10-02T06%3A21%3A39Z&sks=b&skv=2026-02-06&sig=nK2UAmOGA91am0vsEgtt4czLxgHwdieWnGj8cznpHqI%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "70b9ef3ba758414ba20807822ed540535a8ed491210b8883984c8385ca90c6c5  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='564ba9c7b38a87c89470c9ebac3d921014a83378'
          assert p['pullRequest']==67 and p['issue']==66
          assert p['buildRunId']=='36846655451'
          assert p['previewPath']=='/preview/issue-66/'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          PY
      - name: Replace isolated Issue66 subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-66
          mkdir -p preview/issue-66
          cp -R /tmp/p/. preview/issue-66/
          git add preview/issue-66
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-66/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #66 round5 at 564ba9c7b38a87c89470c9ebac3d921014a83378"
          git push origin HEAD:main
