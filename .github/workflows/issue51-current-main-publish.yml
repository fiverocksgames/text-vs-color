name: Publish Issue51 Current Main Preview

on:
  push:
    branches:
      - ops/issue51-current-main-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact preview artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0ca4-8209-a814-710cc7706f33/raw?se=2026-10-04T23%3A41%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=ad3e7df7-446d-5da4-98fb-f0ade7a8f092&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T19%3A48%3A35Z&ske=2026-10-05T19%3A48%3A35Z&sks=b&skv=2026-02-06&sig=DvooqBgL8m5MYPwEQTAtYmexeKtUBV5PF1UrOqv42c4%3D' -o /tmp/issue51.zip
          echo '1301b1cb23a102821a97c461430ee9f1fa872d5df1216662accc163ffc58fd65  /tmp/issue51.zip' | sha256sum -c -
          rm -rf /tmp/issue51
          mkdir -p /tmp/issue51
          unzip -q /tmp/issue51.zip -d /tmp/issue51
          test -f /tmp/issue51/index.html
          test -f /tmp/issue51/DEPLOYMENT_PROVENANCE.json
          grep -q '458830f771a3199ddc56a18193820787dea7da5d' /tmp/issue51/DEPLOYMENT_PROVENANCE.json
          grep -q '"/preview/issue-51/"' /tmp/issue51/DEPLOYMENT_PROVENANCE.json

      - name: Replace only Issue 51 preview channel
        run: |
          set -euo pipefail
          rm -rf preview/issue-51
          mkdir -p preview/issue-51
          cp -R /tmp/issue51/. preview/issue-51/
          git add preview/issue-51
          bad="$(git diff --cached --name-only | grep -v '^preview/issue-51/' || true)"
          test -z "$bad"

      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name "Five Rocks Games"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "preview: refresh Issue 51 from current main"
          git push origin HEAD:main
