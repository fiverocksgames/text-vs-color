name: Publish Issue49 symmetric HUD preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-issue49-symmetric-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-7708-81f8-87fe-57af672e5bfd/raw?se=2026-09-28T13%3A45%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=f238c801-ff1b-51c1-8808-8bde5ff54a31&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T10%3A26%3A32Z&ske=2026-09-29T10%3A26%3A32Z&sks=b&skv=2026-02-06&sig=avbEERraYbsgcVhbV5IuJP6sT61a8D2hcJWfhUxFgdM%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify artifact
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$ARTIFACT_URL" -o /tmp/p.zip
          echo "27fbd709cb597f2aba7a550b28b7571c50d208fc3731500187af103e3f6c0966  /tmp/p.zip" | sha256sum -c -
          rm -rf /tmp/p && mkdir -p /tmp/p
          unzip -q /tmp/p.zip -d /tmp/p
          python3 - <<'PY'
          import hashlib,json,os
          root='/tmp/p'
          p=json.load(open(root+'/DEPLOYMENT_PROVENANCE.json'))
          assert p['sourceRepository']=='fiverocks-dev/text-vs-color'
          assert p['sourceCommit']=='6b982281403710d523f5ab4adfc80912dee7331c'
          assert p['pullRequest']==54 and p['issue']==49
          assert p['previewPath']=='/preview/issue-49/'
          assert p['buildRunId']=='36430147683'
          exp={x['path']:x['sha256'] for x in p['files']}
          act={}
          for base,_,names in os.walk(root):
            for name in names:
              rel=os.path.relpath(os.path.join(base,name),root).replace(os.sep,'/')
              if rel=='DEPLOYMENT_PROVENANCE.json': continue
              with open(os.path.join(base,name),'rb') as f: act[rel]=hashlib.sha256(f.read()).hexdigest()
          assert act==exp,(act,exp)
          PY
      - name: Replace isolated subtree only
        run: |
          set -euo pipefail
          rm -rf preview/issue-49
          mkdir -p preview/issue-49
          cp -R /tmp/p/. preview/issue-49/
          git add preview/issue-49
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(x.startswith('preview/issue-49/') for x in names),names
          PY
          git config user.name "fiverocks-preview-publisher"
          git config user.email "163599746+fiverocksgames@users.noreply.github.com"
          git commit -m "preview: issue #49 symmetric HUD at 6b982281403710d523f5ab4adfc80912dee7331c"
          git push origin HEAD:main
